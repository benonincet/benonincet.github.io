<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authorizing...</title>
</head>
<body>
    <script>
        // Extract parameters safely via exact string parsing splits
        const urlParams = new URLSearchParams(window.location.search);
        const clientId = urlParams.get('client_id');
        const redirectUri = urlParams.get('redirect_uri');
        const state = urlParams.get('state');

        // Execute processing loop ONLY if the credentials match 'pass'
        if (clientId === 'pass' && redirectUri) {
            const mockAuthCode = "code_" + Math.random().toString(36).substring(2, 15);
            
            // Build the precise parameter layout that Claude expects
            const targetCallback = `${decodeURIComponent(redirectUri)}?code=${mockAuthCode}&state=${encodeURIComponent(state)}`;
            
            // Bounce the popup back into Claude's processing channel
            window.location.href = targetCallback;
        } else {
            document.body.innerText = "Error: Invalid Client ID criteria.";
        }
    </script>
</body>
</html>
