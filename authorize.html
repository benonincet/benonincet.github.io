<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authorizing...</title>
</head>
<body>
    <script>
        // 1. Parse out the parameters Claude passed into the URL using your exact working method
        const urlParams = new URLSearchParams(window.location.search);
        const clientId = urlParams.get('client_id');
        const redirectUri = urlParams.get('redirect_uri');
        const state = urlParams.get('state');

        // 2. Only process if the client matching key is explicitly "pass"
        if (clientId === 'pass' && redirectUri) {
            
            // Create a universal access token string
            const UniversalToken = "token_" + Math.random().toString(36).substring(2, 15);
            
            // 3. Rebuild the callback URL using the token parameters instead of a code
            // This satisfies the handshake instantly inside the user's browser window
            const targetCallback = `${decodeURIComponent(redirectUri)}?access_token=${UniversalToken}&token_type=Bearer&expires_in=3600&state=${encodeURIComponent(state)}`;
            
            // Instantly route the browser window to complete the loop
            window.location.href = targetCallback;
        } else {
            document.body.innerText = "Error: Invalid Client Credentials or Missing Redirect Target.";
        }
    </script>
</body>
</html>
