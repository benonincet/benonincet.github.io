<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Benonincet MCP Server</title>
</head>
<body>
    <script>
        // 1. Initialize and link the sandbox network layer
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js', { scope: './' })
                .catch(err => console.error("Worker Boot Error: ", err));
        }

        // 2. Define strict tool contracts matching the Model Context Protocol
        const SERVER_INFO = { name: "benonincet-mcp", version: "1.2.0" };
        const TOOLS_LIST = [
            {
                name: "get_status",
                description: "Returns server environment and deployment status.",
                inputSchema: { type: "object", properties: {} }
            },
            {
                name: "get_latest_data_about_benonincet",
                description: "Fetches live historical data from the Benonincet info JSON file.",
                inputSchema: { type: "object", properties: {} }
            }
        ];

        // 3. Process incoming execution queries transmitted from the Service Worker
        const mcpChannel = new BroadcastChannel('mcp_routing');
        mcpChannel.onmessage = async (event) => {
            const { type, body, id } = event.data;
            if (type === 'mcp_request') {
                let response = { jsonrpc: "2.0", id: body.id };

                if (body.method === "initialize") {
                    response.result = { protocolVersion: "2024-11-05", capabilities: { tools: {} }, serverInfo: SERVER_INFO };
                } else if (body.method === "tools/list") {
                    response.result = { tools: TOOLS_LIST };
                } else if (body.method === "tools/call") {
                    if (body.params.name === "get_status") {
                        response.result = { content: [{ type: "text", text: `Endpoint active at: ${window.location.href}` }] };
                    } 
                    // This is your data switch case targeting the info file
                    else if (body.params.name === "get_latest_data_about_benonincet") {
                        try {
                            const targetUrl = 'https://benonincet.github.io/benonincetinfo.json';
                            const fetchRes = await fetch(targetUrl);
                            const jsonData = await fetchRes.text();
                            response.result = { content: [{ type: "text", text: jsonData }] };
                        } catch (error) {
                            response.result = { content: [{ type: "text", text: `Fetch Error: ${error.message}` }], isError: true };
                        }
                    }
                }
                mcpChannel.postMessage({ type: 'mcp_response', id: id, response: response });
            }
        };
    </script>
</body>
</html>
